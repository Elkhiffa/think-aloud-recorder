<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'"><title>资料台</title><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="insight.css"><link rel="stylesheet" href="desk.css"></head>
<body>
<svg class="icon-sprite" aria-hidden="true"><defs><symbol id="i-record" viewBox="0 0 40 40"><path d="M4 16C4 10 7 7 13 6v4c-3 1-4 3-4 5h4v10H4Z"/><path d="M16 16c0-6 3-9 9-10v4c-3 1-4 3-4 5h4v10h-9Z"/><path d="M30 3h6v35l-3-4-3 4Z"/></symbol></defs></svg>
<div class="desk-frame">
<aside class="rail" aria-hidden="true"><span class="logo"><svg><use href="#i-record"/></svg></span><span class="rail-space app-drag"></span></aside>
<div class="desk-col">
<header class="desk-head app-drag">
  <div class="desk-title"><span class="name" id="deskGame">资料台</span>
    <nav class="desk-tabs" role="tablist" aria-label="资料台"><a href="#" role="tab" id="deskTabSessions" aria-selected="true" class="on">场次</a><a href="#" role="tab" id="deskTabInsight" aria-selected="false">洞察</a></nav>
  </div>
  <div class="win"><button data-win="min" aria-label="最小化">&#xE921;</button><button data-win="max" aria-label="最大化">&#xE922;</button><button data-win="close" class="close" aria-label="关闭">&#xE8BB;</button></div>
</header>

<section class="desk-pane" id="paneSessions" aria-label="场次">
  <div class="desk-split">
    <section class="list" aria-label="场次列表">
      <div class="filters">
        <div class="frow"><span class="fl">状态</span><div class="chips" id="stateChips"></div></div>
        <div class="frow"><span class="fl">问题</span><div class="chips" id="kindChips"></div><span class="sp"></span>
          <label class="sort"><span class="sr-only">排序</span><select id="sortSelect"><option value="time">按时间</option><option value="problems">按问题数</option></select></label>
          <button class="icon" id="searchToggle" aria-label="搜索场次名" title="搜索场次名"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg></button></div>
        <input class="hidden" id="searchInput" type="search" placeholder="搜索场次名或活动">
      </div>
      <div class="scroll" id="sessionScroll" tabindex="0"></div>
    </section>
    <section class="detail" id="sessionDetail" aria-live="polite"><p class="empty">选择左边的一场查看详情。</p></section>
  </div>
</section>

<section class="desk-pane hidden" id="paneInsight" aria-label="洞察">
<header class="topbar">
  <h1 id="title" class="sr-only">洞察</h1>
  <div class="tabs" role="tablist" aria-label="左栏内容">
    <button type="button" role="tab" id="tabReport" aria-selected="true" aria-controls="report">报告</button>
    <button type="button" role="tab" id="tabLibrary" aria-selected="false" aria-controls="library">界面库</button>
  </div>
  <label class="report-choice"><span class="sr-only">选择报告</span><select id="reportSelect"></select></label>
  <button type="button" id="refresh" title="重新读取报告、议题和目录">刷新</button>
  <div class="tabs" role="tablist" aria-label="右栏内容">
    <button type="button" role="tab" id="tabEvidence" aria-selected="true" aria-controls="evidencePane">证据</button>
    <button type="button" role="tab" id="tabFeedback" aria-selected="false" aria-controls="feedbackPane">反馈 <span id="feedbackCount" class="count"></span></button>
  </div>
  <p id="status" class="status" role="status" aria-live="polite"></p>
</header>
<main class="split">
  <div class="left-col">
  <article id="report" class="pane report" tabindex="0" aria-label="分析报告"><p class="empty">正在读取…</p></article>
  <section id="library" class="pane library" role="tabpanel" aria-labelledby="tabLibrary" tabindex="0" hidden><div id="libraryList"></div><nav id="libNext" class="next-bar" aria-label="下一个分类" hidden></nav></section>
  </div>
  <section id="evidencePane" class="pane evidence" role="tabpanel" aria-labelledby="tabEvidence" tabindex="0">
    <div class="evidence-head">
    <div class="tree-bar">
      <button type="button" id="expandAll">全部展开</button>
      <button type="button" id="collapseAll">全部收起</button>
      <div id="kindBar" class="kind-bar" role="group" aria-label="按判断类型筛选"></div>
    </div>
    <div id="filterBar" class="filter-bar" hidden></div>
    </div>
    <div id="evidenceList"></div>
    <nav id="nextBar" class="next-bar" aria-label="下一个议题" hidden></nav>
  </section>
  <section id="feedbackPane" class="pane feedback" role="tabpanel" aria-labelledby="tabFeedback" tabindex="0" hidden>
    <p class="hint">agent 整理的议题、归类和界面名默认接受。你在证据页点“有问题”留下的话都在这里，下一轮整理会逐条处理并写明改了什么。</p>
    <div id="feedbackList"></div>
  </section>
</main>
</section>
</div></div>
<div id="menu" class="menu" role="menu" hidden></div>
<div id="lightbox" class="lightbox" hidden><img id="lightboxImage" alt="所指时刻的大图"><p id="lightboxCaption"></p></div>
<dialog id="deskDialog" class="desk-dialog"><div id="deskDialogBody"></div><div class="desk-dialog-foot" id="deskDialogFoot"></div></dialog>
<div class="toast" id="deskToast" role="status" aria-live="polite"></div>
<script src="desk.js"></script>
<script src="insight.js"></script>
</body></html>
