<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>%%TITLE%% · 回看</title>
  <style>%%PLYR_CSS%%</style>
  <style>%%CSS%%</style>
</head>
<body>
  <!-- Plyr 3.8.4 | %%LICENSE%% -->
  <div hidden aria-hidden="true">%%PLYR_SVG%%</div>
  <header class="review-header">
    <div class="review-brand"><span class="review-mark" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M4 16C4 10 7 7 13 6v4c-3 1-4 3-4 5h4v10H4Z"/><path d="M16 16c0-6 3-9 9-10v4c-3 1-4 3-4 5h4v10h-9Z"/><path d="M30 3h6v35l-3-4-3 4Z"/></svg></span><div class="review-session"><div class="session-title-row"><h1 id="title">%%TITLE%%</h1><button id="renameSession" class="rename-session" aria-label="编辑片段名" title="编辑片段名"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5 4 4M4 20l4-1L20 7l-3-3L5 16Z"/></svg></button></div><form id="renameForm" class="rename-form" hidden><label class="sr-only" for="sessionName">片段名称</label><input id="sessionName" maxlength="4096" autocomplete="off"><button type="submit">保存</button><button type="button" id="cancelRename">取消</button></form><div class="session-meta-row"><p id="sessionInfo" class="session-info"></p><div class="copy-split" id="copySplit">
            <button id="copyPath" data-copy="vault" title="复制资料库路径">
              <svg class="copy-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>
              <svg class="check-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
              <span id="copyLabel" aria-live="polite">复制资料库路径</span>
            </button>
            <button id="fileActionsToggle" aria-label="选择要复制的路径" title="选择要复制的路径" aria-expanded="false" aria-controls="fileActions"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></button>
            <div class="file-actions" id="fileActions" hidden>
              <button id="folder">打开场次文件夹</button>
              <button data-copy="folder">复制场次文件夹路径</button>
              <button data-copy="transcript">复制逐字稿路径（JSON）</button>
              <button data-copy="video">复制视频路径</button>
              <button id="alignInputs">校准操作时间…</button>
              <button id="originalFrame" aria-pressed="false" hidden>显示原始画幅（含黑边）</button>
              <div class="menu-separator" role="separator"></div>
              <button data-document="notes">打开复盘文档</button>
              <button data-document="transcript">打开逐字稿文档</button>
            </div>
          </div></div><p id="sessionContent" class="session-content"></p></div><span id="testLabel" hidden>合成测试</span></div>
    <div class="review-header-actions"><span class="review-wordmark">Think Aloud</span><button id="themeButton" class="theme-button" aria-label="切换深色模式" title="切换深色模式"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14a8 8 0 0 1-10-10 8.5 8.5 0 1 0 10 10Z"/></svg></button></div>
  </header>
  <main class="review-layout">
    <section id="videoPane" class="video-column" aria-label="录像与资料">
      <div class="video-slot"><video id="video" controls playsinline preload="metadata"></video>

      </div>
      <div id="reviewCompanion" class="review-companion">
      <section id="currentQuotePanel" class="current-quote-panel" aria-label="随播放显示的原话">
        <div class="current-quote-heading"><h2 id="currentQuoteLabel">原话</h2><button id="currentQuoteTime" type="button" title="回到这句原话" hidden></button></div>
        <div class="current-quote-body"><span id="currentQuoteSpeaker" class="speaker-tag" hidden></span><p id="currentQuoteText"></p></div>
      </section>
      <section id="inputPanel" class="input-panel" aria-label="最近操作">
        <div class="input-heading"><h2>最近操作</h2><div class="input-modes" aria-label="操作显示方式"><button data-input-mode="keys" aria-pressed="true">最近按键</button><button data-input-mode="device" aria-pressed="false">设备图</button><button data-input-mode="collapsed" aria-pressed="false">收起</button></div></div>
        <div id="inputBody" class="input-body"><div class="input-meta"><span id="inputSource"></span><span id="inputFocusState" hidden></span><label id="deviceSelectLabel" hidden><span class="sr-only">显示设备</span><select id="deviceSelect"><option value="auto">自动切换</option><option value="keyboard">键盘 + 鼠标</option><option value="xbox">Xbox</option><option value="dualsense">DualSense</option></select></label></div><div id="currentKeys" class="current-keys"></div><div id="deviceView" class="device-view" hidden></div><p id="inputState" class="input-state"></p></div>
      </section>
      </div>
      <div class="file-card">
        <p id="status" role="status">正在加载录像…</p>
      </div>
    </section>
    <div id="reviewSplitter" class="review-splitter" role="separator" tabindex="0"
         aria-label="调整视频与转写文本的比例" aria-controls="videoPane transcriptPane"
         aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-valuenow="59"
         title="拖动调整比例，双击或按 Enter 重新适配视频；选中后可用方向键微调。"></div>
    <aside id="transcriptPane" class="transcript" aria-label="口述逐字稿">
      <div class="transcript-heading"><div class="review-tabs" role="tablist" aria-label="回看记录"><button id="inputTab" role="tab" aria-selected="true" aria-controls="inputTimelinePanel">操作时间轴</button><button id="transcriptTab" role="tab" aria-selected="false" aria-controls="lines">原话</button><button id="eventsTab" role="tab" aria-selected="false" aria-controls="experienceEvents" hidden>体验事件</button></div><button id="follow" aria-pressed="true">跟随播放：开</button></div>
      <p id="preprocessingNotice" class="preprocessing-notice" role="status" hidden></p>
      <button id="speakerSummary" class="speaker-summary" hidden aria-haspopup="dialog" aria-controls="speakerDialog"><span id="recorderLabel"></span><span>修改</span></button>
      <section id="inputTimelinePanel" class="input-timeline-panel" role="tabpanel" aria-labelledby="inputTab"><div class="timeline-column-headings"><span title="滚轮调整时间轴缩放">时间</span><span>原话</span><span>方向</span><span>指向</span><span>按键</span></div><div id="inputTimeline" class="input-timeline" tabindex="0" aria-label="操作时间轴，点击时间刻度或空白处定位，纵向拖动调整进度；内容区滚轮仅浏览记录，不改变播放进度，时间刻度区滚轮调整缩放"><div id="timelineTicks" class="timeline-ticks"></div><div id="timelineSpeech" class="timeline-speech"></div><div id="timelineInputs" class="timeline-inputs"></div><div id="timelineGaps" class="timeline-gaps"></div><div id="timelinePlayhead" class="timeline-playhead"><time></time></div></div><div class="timeline-footer"><label id="inputScopeLabel" hidden><span class="sr-only">显示操作范围</span><select id="inputScope" aria-label="显示操作范围"><option value="all">全部操作</option><option value="foreground">仅游戏前台</option></select></label><span id="timelineState"></span><span id="timelineScale" title="时间刻度区滚轮缩放"></span></div></section>
      <label id="transcriptSearch" class="search-label" hidden><span class="sr-only">搜索逐字稿</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="search" type="search" placeholder="搜索逐字稿" autocomplete="off"><span id="lineCount"></span></label>
      <p class="sr-only" id="transcriptHint">点击原话定位视频。自动转写的文字可能需要校对。</p>
      <div id="lines" tabindex="0" role="tabpanel" aria-labelledby="transcriptTab" aria-label="逐字稿列表" aria-describedby="transcriptHint" title="点击原话，播放对应的视频" hidden></div>
      <p id="empty" hidden>没有匹配的原话。</p>
      <div id="experienceEvents" class="experience-events" tabindex="0" role="tabpanel" aria-labelledby="eventsTab" hidden></div>
    </aside>
  </main>
  <div id="quotePopover" class="quote-popover" role="dialog" aria-label="原话全文" hidden><div class="quote-popover-heading"><time id="quoteTime"></time><button id="quoteClose" aria-label="关闭原话">×</button></div><span id="quoteSpeaker" class="speaker-tag" hidden></span><p id="quoteText"></p></div>
  <dialog id="eventDialog" class="event-dialog" aria-labelledby="eventEditTitle">
    <form id="eventForm">
      <header><h2 id="eventEditTitle">校准体验事件</h2><button type="button" id="closeEventEdit" aria-label="关闭编辑">×</button></header>
      <div class="event-edit-body">
        <div class="event-edit-times"><label>开始时间<input id="eventEditstart" required placeholder="00:00:00.000" inputmode="decimal"></label><label>结束时间<input id="eventEditend" required placeholder="00:00:00.000" inputmode="decimal"></label></div>
        <label>名称<input id="eventEdittitle" maxlength="160" required></label>
        <label>概述<textarea id="eventEditsummary" rows="3" maxlength="3000" required></textarea></label>
        <label>问题与感受<textarea id="eventEditissue" rows="3" maxlength="3000" placeholder="同一活动内的多个问题与感受可分行填写；没有可留空"></textarea></label>
        <label>备注与判断边界<textarea id="eventEditnotes" rows="3" maxlength="2000" placeholder="还不能确定什么、哪些判断需要核实"></textarea></label>
        <p class="event-edit-hint">保留原整理结果和修改差异，供下次整理参考。时间相对于本段录像开始。</p>
        <p id="eventEditError" role="alert" hidden></p>
      </div>
      <footer><button id="cancelEventEdit" type="button">取消</button><button id="saveEventEdit" type="submit">保存修改</button></footer>
    </form>
  </dialog>
  <dialog id="speakerDialog" class="speaker-dialog" aria-labelledby="speakerTitle" aria-describedby="speakerExplanation">
    <audio id="speakerAudio" preload="none"></audio>
    <form id="speakerForm">
      <div class="speaker-dialog-heading"><h2 id="speakerTitle">谁是记录者</h2><button type="button" id="closeSpeakers" aria-label="关闭说话人设置">×</button></div>
      <p id="speakerExplanation">优先参考讲述时长，再参考麦克风中的典型音量。自动推荐可能有误，试听后可以修改。</p>
      <p id="speakerReason" class="speaker-reason"></p>
      <fieldset id="speakerChoices"><legend class="sr-only">选择记录者</legend></fieldset>
      <p id="speakerSaveScope" class="speaker-reason"></p>
      <p id="speakerError" role="alert" hidden></p>
      <div class="speaker-dialog-actions"><button id="autoSpeaker" type="button">恢复自动</button><button id="saveSpeaker" type="submit">保存选择</button></div>
    </form>
  </dialog>
  <section id="alignmentPanel" class="alignment-panel" role="dialog" aria-labelledby="alignmentTitle" hidden>
    <form id="alignmentForm">
      <div class="alignment-heading"><strong id="alignmentTitle">校准操作时间</strong><button id="cancelAlignment" type="button" aria-label="取消校准">×</button></div>
      <p id="alignmentHint">仅调整本片段的操作显示，录像和原始记录保持不变。</p>
      <label for="inputOffset">操作时间偏移（秒）</label>
      <div class="alignment-value"><button type="button" data-offset-step="-0.1" aria-label="操作提前 0.1 秒">−</button><input id="inputOffset" type="number" min="-30" max="30" step="0.001" value="0"><button type="button" data-offset-step="0.1" aria-label="操作后移 0.1 秒">＋</button></div>
      <p>负值提前，正值后移；调整后可直接播放对照。</p>
      <p id="alignmentError" role="alert" hidden></p>
      <div class="alignment-actions"><button id="resetAlignment" type="button">恢复自动</button><button type="submit">保存</button></div>
    </form>
  </section>
  <script id="review-data" type="application/json">%%DATA%%</script>
  <script>%%PLYR_JS%%</script>
  <script>%%JS%%</script>
</body>
</html>
