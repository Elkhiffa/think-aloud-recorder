<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>%%TITLE%% · 同步回看</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f2;color:#202a30;font:16px/1.65 system-ui}header{padding:16px 28px;background:white;border-bottom:1px solid #ddd}h1{font-size:22px;margin:0}small{color:#647078}main{display:grid;grid-template-columns:58% 42%;height:calc(100vh - 100px)}section{padding:24px}video{width:100%;max-height:65vh;background:#101820}aside{border-left:1px solid #ddd;display:flex;flex-direction:column;padding:20px}#lines{overflow-y:auto;flex:1;margin-top:12px}.line{display:block;width:100%;border:0;background:none;text-align:left;padding:14px;font:inherit;cursor:pointer;border-radius:8px}.line.active{background:#d7ebe3;color:#074f3a}.line:hover{background:#e9e9e3}time{display:block;font-size:12px;color:#677}input{padding:10px;font:inherit}a{color:#126951}button,select{padding:8px}#status{font-size:13px}@media(max-width:800px){main{grid-template-columns:1fr;height:auto}#lines{max-height:55vh}}</style>
<header><h1>%%TITLE%%</h1><small>%%ID%% · 原声是最终依据；机器转写未经校对</small></header>
<main><section><video id="video" controls preload="metadata" src="录像.mp4"></video><p><label>速度 <select id="speed"><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select></label> <button id="follow">自动跟随：开</button></p><p id="status">点击右侧原话定位画面；手动滚动暂停跟随 5 秒。</p><p><a href="复盘.md">打开复盘文件</a> · <a href="逐字稿.md">完整逐字稿</a></p></section><aside><input id="search" placeholder="搜索原话"><div id="lines"></div></aside></main>
<script>const segments=%%DATA%%;const video=document.querySelector('video'),lines=document.querySelector('#lines');let follow=true,pauseUntil=0,current=-1;const nodes=segments.map((s,i)=>{let b=document.createElement('button');b.className='line';let t=document.createElement('time');t.textContent=new Date(s.start*1000).toISOString().slice(11,23);b.append(t,document.createTextNode(s.text));b.onclick=()=>{video.currentTime=s.start;pauseUntil=0;video.play().catch(()=>{});};lines.append(b);return b});document.querySelector('#speed').onchange=e=>video.playbackRate=+e.target.value;document.querySelector('#follow').onclick=e=>{follow=!follow;e.target.textContent='自动跟随：'+(follow?'开':'关')};lines.addEventListener('wheel',()=>pauseUntil=Date.now()+5000);document.querySelector('#search').oninput=e=>nodes.forEach((n,i)=>n.hidden=!segments[i].text.toLowerCase().includes(e.target.value.toLowerCase()));video.ontimeupdate=()=>{const i=segments.findIndex(s=>s.start<=video.currentTime&&s.end>video.currentTime);if(i===current)return;nodes[current]?.classList.remove('active');current=i;nodes[i]?.classList.add('active');if(follow&&Date.now()>pauseUntil)nodes[i]?.scrollIntoView({block:'center',behavior:'smooth'})};video.onerror=()=>document.querySelector('#status').textContent='录像无法加载：请完整解压资料包，并保留此网页与录像.mp4在同一目录。';if(!segments.length)lines.textContent='没有识别出语音，请检查原声。';</script></html>
